<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veke 37 – Dei første statane</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#20262e;--muted:#59636f;--border:#d8dde3;--accent:#2f6f55;--soft:#edf5f1;--good:#e2f3e8;--bad:#f8e5e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
main{max-width:760px;margin:auto;padding:24px 16px 40px}h1{font-size:27px;margin:0 0 8px}.intro{color:var(--muted);font-size:17px;margin:0 0 20px}
.bar{height:10px;background:#e3e7ea;border-radius:99px;overflow:hidden;margin:7px 0 18px}#fill{height:100%;background:var(--accent)}#label{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}.q{font-size:23px;font-weight:700;margin:3px 0 18px}
.answers{display:grid;gap:11px}.answer{text-align:left;width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:white;font-size:17px;cursor:pointer;min-height:52px}
.answer:hover{border-color:#929da8}.answer.selected{border:2px solid var(--accent);background:var(--soft)}.feedback{display:none;margin-top:16px;padding:13px;border-radius:10px;font-size:16px}
.good{display:block;background:var(--good)}.bad{display:block;background:var(--bad)}.controls{display:flex;gap:10px;margin-top:18px}
.controls button,#restart{border:0;border-radius:10px;padding:11px 17px;min-height:46px;font-size:16px;cursor:pointer}#next{margin-left:auto;background:var(--accent);color:white}#next:disabled{opacity:.45}#prev{background:#e9ecef}
.result{text-align:center}.score{font-size:38px;font-weight:700;margin:10px}.note{margin-top:18px;padding:14px;border-left:4px solid var(--accent);background:var(--soft);text-align:left}
@media(max-width:520px){h1{font-size:23px}.q{font-size:20px}.card{padding:17px}}
</style></head>
<body><main>
<h1>Historiequiz: Frå jordbruk til dei første statane</h1>
<p class="intro">15 spørsmål. Ingen tidtaking. Nokre spørsmål har fleire svar som kan sjå nesten rette ut – vel det mest presise.</p>
<div id="label"></div><div class="bar"><div id="fill"></div></div>
<section class="card" id="quiz"><div class="q" id="question"></div><div class="answers" id="answers"></div><div id="feedback" class="feedback"></div>
<div class="controls"><button id="prev">Tilbake</button><button id="next" disabled>Neste</button></div></section>
<section class="card result" id="result" style="display:none"><h2>Ferdig! 💪</h2><div class="score" id="score"></div><p id="message"></p>
<div class="note"><strong>Munnleg etterpå:</strong><br>Forklar denne kjeda med eigne ord:<br><strong>jordbruk → overskot → arbeidsdeling → større samfunn → stat</strong></div>
<button id="restart" style="margin-top:18px;background:var(--accent);color:white">Ta quizen på nytt</button></section>
</main>
<script>
const qs = [{"q": "Kvifor kunne jordbruksoverskot bidra til at dei første statane voks fram?", "options": ["Fordi alle måtte arbeide meir med matproduksjon og fekk mindre tid til andre oppgåver", "Fordi overskot kunne støtte arbeidsdeling, handel og menneske som hadde andre oppgåver enn jordbruk", "Fordi overskot gjorde forsvar og organisering unødvendig", "Fordi overskot førte til at folk slutta å bu fast"], "correct": 1, "ok": "Rett. Overskot gjorde det mogleg at nokre kunne spesialisere seg, og større samfunn fekk behov for meir organisering.", "no": "Sjå etter samanhengen mellom overskot, arbeidsdeling og behovet for å organisere eit større samfunn."}, {"q": "Kvifor kravde jordbruket i Mesopotamia mykje organisering?", "options": ["Området var svært vått heile året, så bøndene måtte drenere alt vatnet bort", "Bøndene måtte både lage kanalar for vatn og byggje vern mot flaum", "Elvane kunne ikkje brukast i jordbruket", "Jorda kunne berre dyrkast dersom folk flytta kvar sesong"], "correct": 1, "ok": "Rett. Tørt klima gjorde kanalar nødvendige, medan flaum frå Eufrat og Tigris også måtte kontrollerast.", "no": "Mesopotamia trong både vatning og flombeskyttelse. Det kravde samarbeid og organisering."}, {"q": "Kva er den beste forklaringa på at Mesopotamia og Egypt utvikla seg ulikt?", "options": ["Dei hadde identiske naturforhold, men heilt ulike religionar", "Naturforholda var ulike, og det gav ulike behov for vatning, forsvar og organisering", "Egypt hadde ikkje jordbruk, medan Mesopotamia hadde jordbruk", "Mesopotamia hadde ingen elvar, medan Egypt hadde Nilen"], "correct": 1, "ok": "Rett. Nilen var meir føreseieleg, og Egypt hadde meir naturleg vern, medan Mesopotamia hadde større utfordringar med både flaum og forsvar.", "no": "Samanlikn kor føreseielege elvane var, og kor utsette områda var for angrep utanfrå."}, {"q": "Kvifor hadde Egypt mindre behov for omfattande flomvern enn Mesopotamia?", "options": ["Nilen fløymde meir føreseieleg enn Eufrat og Tigris", "Egypt hadde ingen årlege flaumar", "Bøndene i Egypt brukte ikkje elvevatn i jordbruket", "Egypt låg i eit område med mykje regn heile året"], "correct": 0, "ok": "Rett. Nilens flaum var meir føreseieleg, og det gjorde jordbruket lettare å planleggje.", "no": "Det avgjerande var ikkje at Egypt slapp flaum, men at Nilens flaum var meir føreseieleg."}, {"q": "Kvifor bygde dei sumeriske bystatane bymurar?", "options": ["For å halde Nilen ute", "Fordi elveslettene i Mesopotamia mangla naturleg vern mot fiendar", "For å avgrense jordbruksarealet", "Fordi alle byar måtte vere runde"], "correct": 1, "ok": "Rett. Mesopotamia mangla naturlege forsvarsbarrierar, så bymurar blei viktige.", "no": "Tenk på kor utsett Mesopotamia var for angrep frå utsida."}, {"q": "Kva viser best korleis skriftspråk kunne styrkje staten?", "options": ["Skrift gjorde at alle innbyggjarane fekk like mykje makt", "Skrift kunne brukast til skattar, varelister og avtalar og gjorde administrasjonen meir effektiv", "Skrift gjorde handel unødvendig", "Skrift blei berre brukt til forteljingar og hadde ingen praktisk funksjon"], "correct": 1, "ok": "Rett. Skrift gjorde det lettare å halde oversikt over skatt, varer og avtalar i større samfunn.", "no": "NDLA legg vekt på dei administrative funksjonane til skriftspråket."}, {"q": "Kvifor kunne skriftspråket også bidra til å samle makt hos få?", "options": ["Fordi berre eit mindretal kunne skrive og lese", "Fordi skrift automatisk gjorde herskarane til gudar", "Fordi alle lover blei hemmelege", "Fordi bøndene slutta å bruke munnleg språk"], "correct": 0, "ok": "Rett. Når få meistra skrivekunsten, kunne kunnskap og administrasjon bli kontrollert av ei avgrensa gruppe.", "no": "Tenk på kven som faktisk hadde tilgang til skrivekunsten."}, {"q": "Ein arkeolog finn leirtavler med skattelister, handelsavtalar og varelister. Kva kan dette best tyde på?", "options": ["At samfunnet var lite og utan administrasjon", "At samfunnet hadde behov for å registrere og styre økonomiske forhold", "At menneska levde som mobile jegerar og sankarar", "At alle innbyggjarane kunne lese og skrive"], "correct": 1, "ok": "Rett. Slike kjelder tyder på eit samfunn med administrasjon, handel og økonomisk organisering.", "no": "Bruk kjelda forsiktig: ho viser organisering og registrering, men ikkje at alle kunne skrive."}, {"q": "Kva er den beste årsakskjeda frå jordbruk til stat?", "options": ["Jordbruk → overskot → arbeidsdeling → større samfunn → meir behov for styring", "Jordbruk → mindre mat → mindre samarbeid → stat", "Jordbruk → meir flytting → mindre busetjing → stat", "Jordbruk → skrift → jeger- og sankarsamfunn → stat"], "correct": 0, "ok": "Rett. Dette viser korleis fleire samfunnsendringar kunne byggje på kvarandre.", "no": "Sjå etter ei kjede der kvart ledd gjer det neste meir sannsynleg."}, {"q": "Kvifor kunne større rikdom etter overgangen til jordbruk skape behov for forsvar?", "options": ["Fordi folk no kunne samle eigedom og overskot som andre kunne prøve å ta", "Fordi jordbruk gjorde alle naboar til fiendar", "Fordi jegerar og sankarar aldri forsvarte seg", "Fordi overskot berre kunne lagrast utanfor busetjinga"], "correct": 0, "ok": "Rett. Fast eigedom og lagra rikdom kunne vere verd å forsvare.", "no": "Tenk på kva som endra seg når menneske kunne samle eigedom over fleire generasjonar."}, {"q": "Kvifor kunne elvar vere både ein ressurs og ein trussel?", "options": ["Dei gav vatn og fruktbar jord, men flaum kunne øydeleggje avlingar og busetjing", "Dei gav berre fisk, men hindra jordbruk", "Dei gjorde transport umogleg, men gav vern mot alle fiendar", "Dei gjorde jordbruk unødvendig, men auka handelen"], "correct": 0, "ok": "Rett. Elvane la grunnlag for jordbruk, men oversvømmingar kunne også vere øydeleggjande.", "no": "Sjå etter eit svar som viser både fordel og risiko ved elvane."}, {"q": "Kvifor kunne Nilen gjere det lettare å administrere Egypt som eitt rike?", "options": ["Elva gjorde transport av varer og menneske lettare", "Elva gjorde at alle byar måtte vere sjølvstendige", "Elva stengde all kontakt mellom ulike delar av riket", "Elva gjorde jordbruk umogleg utanfor hovudstaden"], "correct": 0, "ok": "Rett. Nilen fungerte som ei viktig transportåre og gjorde handel og administrasjon enklare.", "no": "Tenk på korleis ei lang elv kan binde område saman."}, {"q": "Kvifor hadde Egypt mindre behov for å organisere eit stort forsvar enn Mesopotamia?", "options": ["Egypt var omgitt av ørken som gav naturleg vern", "Egypt hadde ingen rikdom som andre ønskte", "Egypt hadde inga befolkning utanfor hovudstaden", "Farao forbød krig"], "correct": 0, "ok": "Rett. Ørkenen rundt Nildalen gjorde Egypt mindre utsett for angrep enn Mesopotamia.", "no": "Samanlikn kor mykje naturleg vern dei to områda hadde."}, {"q": "Kva viser faraoen si rolle best om forholdet mellom religion og makt i Egypt?", "options": ["Religion og politisk makt kunne vere tett knytte saman", "Religion hadde ingen betydning for styresettet", "Faraoen hadde berre religiøse oppgåver og ingen politisk rolle", "Gudane blei valde av bøndene kvart år"], "correct": 0, "ok": "Rett. Faraoen var både herskar og rekna som guddommeleg, så religion og politisk makt hang tett saman.", "no": "Tenk på at faraoen både var herskar og blei rekna som gud."}, {"q": "Kva er den beste samla forklaringa på kvifor dei første sivilisasjonane voks fram i elvedalar?", "options": ["Elvane gav vatn og fruktbar jord, og dette kunne skape overskot som igjen kravde meir samarbeid, administrasjon og styring", "Elvane gjorde at menneske kunne slutte å samarbeide", "Elvane gjorde alle samfunn rike utan behov for arbeid", "Elvane førte automatisk til det same styresettet overalt"], "correct": 0, "ok": "Rett. Naturressursane gav grunnlag for jordbruk, medan større overskot og busetjingar skapte behov for organisering.", "no": "Vel svaret som bind saman naturgrunnlag, jordbruk, overskot og organisering."}];
let i=0,chosen=Array(qs.length).fill(null);
const Q=document.getElementById('question'),A=document.getElementById('answers'),F=document.getElementById('feedback'),N=document.getElementById('next'),P=document.getElementById('prev'),L=document.getElementById('label'),B=document.getElementById('fill');
function render(){
 const x=qs[i];Q.textContent=x.q;L.textContent=`Spørsmål ${i+1} av ${qs.length}`;B.style.width=`${(i+1)/qs.length*100}%`;A.innerHTML='';F.className='feedback';F.textContent='';
 x.options.forEach((o,j)=>{const b=document.createElement('button');b.type='button';b.className='answer'+(chosen[i]===j?' selected':'');b.textContent=o;b.addEventListener('click',()=>{chosen[i]=j;render()});A.appendChild(b)});
 if(chosen[i]!==null){const good=chosen[i]===x.correct;F.textContent=good?x.ok:x.no;F.className='feedback '+(good?'good':'bad')}
 P.style.visibility=i===0?'hidden':'visible';N.disabled=chosen[i]===null;N.textContent=i===qs.length-1?'Sjå resultat':'Neste';
}
N.addEventListener('click',()=>{if(chosen[i]===null)return;if(i<qs.length-1){i++;render()}else showResult()});
P.addEventListener('click',()=>{if(i>0){i--;render()}});
function showResult(){
 const s=chosen.reduce((n,a,k)=>n+(a===qs[k].correct),0);
 document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';
 document.getElementById('score').textContent=`${s} av ${qs.length}`;
 document.getElementById('message').textContent=s>=13?'Svært bra! Du viser god forståing av samanhengar og årsaker.':s>=10?'Bra jobba! Du har godt tak i hovudstoffet. Sjå på forklaringane til spørsmåla du bomma på.':s>=7?'Du har ein del på plass. Repeter særleg årsakskjedene og forskjellen mellom Mesopotamia og Egypt.':'Ta ein kort repetisjon av stoffet og prøv quizen ein gong til.';
 L.textContent='Ferdig';B.style.width='100%';
}
document.getElementById('restart').addEventListener('click',()=>{i=0;chosen=Array(qs.length).fill(null);document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render()});
render();
</script></body></html>
