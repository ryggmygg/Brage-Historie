<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historiequiz – frå jegerar og sankarar til jordbruk</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#20262e;--muted:#59636f;--border:#d8dde3;--accent:#2f6f55;--soft:#edf5f1;--good:#e2f3e8;--bad:#f8e5e5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
main{max-width:760px;margin:auto;padding:24px 16px 40px} h1{font-size:27px;margin:0 0 8px} .intro{color:var(--muted);font-size:17px;margin:0 0 20px}
.bar{height:10px;background:#e3e7ea;border-radius:99px;overflow:hidden;margin:7px 0 18px} #fill{height:100%;background:var(--accent)}
#label{color:var(--muted);font-size:15px} .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.q{font-size:23px;font-weight:700;margin:3px 0 18px} .answers{display:grid;gap:11px}
.answer{text-align:left;width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:white;font-size:17px;cursor:pointer;min-height:52px}
.answer:hover{border-color:#929da8} .answer.selected{border:2px solid var(--accent);background:var(--soft)}
.feedback{display:none;margin-top:16px;padding:13px;border-radius:10px;font-size:16px} .good{display:block;background:var(--good)} .bad{display:block;background:var(--bad)}
.controls{display:flex;gap:10px;margin-top:18px} .controls button,#restart{border:0;border-radius:10px;padding:11px 17px;min-height:46px;font-size:16px;cursor:pointer}
#next{margin-left:auto;background:var(--accent);color:white} #next:disabled{opacity:.45} #prev{background:#e9ecef} .result{text-align:center} .score{font-size:38px;font-weight:700;margin:10px}
.note{margin-top:18px;padding:14px;border-left:4px solid var(--accent);background:var(--soft);text-align:left} @media(max-width:520px){h1{font-size:23px}.q{font-size:20px}.card{padding:17px}}
</style></head>
<body><main>
<h1>Historiequiz: Frå jegerar og sankarar til jordbruk</h1>
<p class="intro">12 spørsmål. Ingen tidtaking. Les roleg og vel det svaret du meiner er best.</p>
<div id="label"></div><div class="bar"><div id="fill"></div></div>
<section class="card" id="quiz"><div class="q" id="question"></div><div class="answers" id="answers"></div><div id="feedback" class="feedback"></div>
<div class="controls"><button id="prev">Tilbake</button><button id="next" disabled>Neste</button></div></section>
<section class="card result" id="result" style="display:none"><h2>Ferdig! 💪</h2><div class="score" id="score"></div><p id="message"></p>
<div class="note"><strong>Munnleg etterpå:</strong><br>Vel eitt spørsmål du synest var vanskeleg. Forklar: <strong>Kva skjedde? → Kvifor? → Kva førte det til?</strong></div>
<button id="restart" style="margin-top:18px;background:var(--accent);color:white">Ta quizen på nytt</button></section>
</main>
<script>
const qs=[{"q": "Kva er den beste forklaringa på kvifor historikarar kan vite noko om menneske som levde før skriftspråket?", "options": ["Dei kan berre gjette ut frå korleis menneske lever i dag", "Dei kan undersøkje materielle spor som reiskapar, knoklar, buplassar og gravfunn", "Dei kan lese tekstar menneska sjølve skreiv", "Det er ikkje mogleg å vite noko om tida før skriftspråket"], "correct": 1, "ok": "Ja. Materielle spor kan brukast som historiske kjelder sjølv om menneska ikkje etterlet seg skrift.", "no": "Historikarar kan bruke materielle spor som reiskapar, knoklar, buplassar og gravfunn."}, {"q": "Kvifor måtte mange jegerar og sankarar flytte mellom ulike område?", "options": ["Dei måtte følgje tilgang på dyr, plantar og andre ressursar", "Dei hadde ikkje lov til å bu fast", "Dei kunne ikkje byggje hus", "Dei flytta fordi jordbruksjorda blei utarma"], "correct": 0, "ok": "Ja. Tilgangen på mat og andre naturressursar endra seg med stad og årstid.", "no": "Tenk på kor maten kom frå: tilgang på dyr, plantar og andre ressursar endra seg gjennom året."}, {"q": "Kva er den mest presise forklaringa på jordbruksrevolusjonen?", "options": ["Ei rask oppfinning som gjorde alle menneske til bønder samtidig", "Ein gradvis overgang til dyrking og husdyrhald som endra måten mange menneske levde på", "Ei tid då menneske slutta heilt med jakt og sanking", "Overgangen frå handreiskapar til jordbruksmaskiner"], "correct": 1, "ok": "Ja. Endringa var grunnleggjande, men ho skjedde gradvis og til ulik tid ulike stader.", "no": "Ordet «revolusjon» viser til kor stor endringa var. Overgangen skjedde likevel gradvis."}, {"q": "Kvifor begynte menneske med jordbruk? Kva svar er mest historisk presist?", "options": ["Det finst éi sikker årsak: menneska blei lei av å jakte", "Jordbruk var alltid enklare og gav betre helse", "Fleire forhold kan ha verka saman, mellom anna klima, tilgang på plantar og dyr og behov for mat", "Ein konge bestemte at menneska skulle bli bønder"], "correct": 2, "ok": "Ja. Store historiske endringar har ofte fleire årsaker, og overgangen til jordbruk skjedde ulikt frå stad til stad.", "no": "Det finst ikkje éi enkel forklaring. Historikarar ser på fleire forhold som kan ha verka saman."}, {"q": "Ein jordbruksfamilie er avhengig av nokre få kornsortar. Kva kan vere ei ulempe samanlikna med eit variert jeger- og sankarkosthald?", "options": ["Dei blir mindre sårbare dersom avlinga slår feil", "Kosthaldet kan bli mindre variert, og ei dårleg avling kan få store konsekvensar", "Dei kan ikkje lagre mat", "Dei får automatisk meir næringsrik mat"], "correct": 1, "ok": "Ja. Avhengigheit av få matvarer kan gi mindre variert kosthald og større sårbarheit ved avlingssvikt.", "no": "Tenk både på variasjonen i maten og kva som skjer dersom ei viktig avling sviktar."}, {"q": "Kvifor kunne smittsame sjukdommar bli eit større problem i jordbrukssamfunn?", "options": ["Fleire menneske budde tettare, og menneske levde nær husdyr", "Jordbruk gjorde menneska ute av stand til å utvikle immunitet", "Jegerar og sankarar kunne ikkje bli sjuke", "Korn skapte alltid virus"], "correct": 0, "ok": "Ja. Tettare busetjing og nær kontakt med husdyr gav betre vilkår for at smitte kunne spreie seg.", "no": "Sjå etter svaret som handlar om korleis menneske og dyr levde etter at folk busette seg fast."}, {"q": "Kva meiner vi med overskot i eit jordbrukssamfunn?", "options": ["At alle produserer akkurat nok mat til seg sjølve", "At samfunnet produserer meir mat enn det treng med ein gong", "At bøndene kastar maten dei ikkje likar", "At alle sluttar å arbeide med mat"], "correct": 1, "ok": "Ja. Eit overskot kan lagrast, bytast eller brukast til å forsørgje menneske som gjer andre oppgåver.", "no": "Tenk på forskjellen mellom kor mykje mat som blir produsert og kor mykje som må brukast med ein gong."}, {"q": "Kvifor er matoverskot viktig når vi skal forklare arbeidsdeling?", "options": ["Overskot gjorde at ikkje alle måtte produsere mat, så nokre kunne spesialisere seg i andre oppgåver", "Overskot gjorde at alle måtte gjere nøyaktig same arbeid", "Overskot førte til at menneska måtte flytte oftare", "Overskot gjorde jordbruk unødvendig"], "correct": 0, "ok": "Ja. Når nokre kunne produsere mat for fleire, kunne andre bli til dømes handverkarar eller få andre oppgåver.", "no": "Spør deg: Kva kan andre bruke tida på dersom nokre få produserer nok mat til fleire?"}, {"q": "Kva årsakskjede forklarer best korleis jordbruk kunne bidra til større og meir komplekse samfunn?", "options": ["Fast busetjing → matoverskot → arbeidsdeling → større samfunn", "Arbeidsdeling → jakt → flytting → jordbruk", "Store byar → jordbruk → jegerar og sankarar → matoverskot", "Matoverskot → mindre samarbeid → meir flytting → mindre samfunn"], "correct": 0, "ok": "Ja. Dette viser korleis fleire endringar kunne byggje på kvarandre over tid.", "no": "Finn kjeda der kvart ledd gjer det neste lettare å forklare."}, {"q": "Kvifor er det for enkelt å seie at jordbruk berre var eit framsteg?", "options": ["Fordi jordbruk ikkje førte til nokon viktige endringar", "Fordi jordbruk gav fordelar som fast busetjing og overskot, men også kunne gi sjukdom, hardt arbeid og mindre variert kosthald", "Fordi alle jegerar og sankarar hadde eit betre liv enn alle bønder", "Fordi menneske slutta med jordbruk etter kort tid"], "correct": 1, "ok": "Ja. Historisk utvikling kan ha både gevinstar og kostnader. Jordbruket endra livet på fleire måtar.", "no": "Sjå etter eit svar som viser både positive og negative konsekvensar."}, {"q": "Kva fortel det oss at jordbruk oppstod til ulik tid i ulike delar av verda?", "options": ["At alle samfunn utviklar seg på nøyaktig same måte", "At jordbruksrevolusjonen var ein lang og ulik prosess, ikkje éi hending som skjedde samtidig overalt", "At jordbruk berre kunne oppstå éin gong", "At jegerar og sankarar forsvann straks jordbruk blei utvikla"], "correct": 1, "ok": "Ja. Overgangen var ein prosess som skjedde til ulik tid og på ulike måtar.", "no": "Tenk på forskjellen mellom ei enkelt hending og ei utvikling som skjer over lang tid."}, {"q": "Kva er den beste samla forklaringa på kvifor jordbruksrevolusjonen er eit historisk vendepunkt?", "options": ["Fordi menneska fekk ein ny type mat", "Fordi menneska begynte å halde dyr, og ingenting anna endra seg", "Fordi endringar i matproduksjon la grunnlag for fast busetjing, overskot, arbeidsdeling og etter kvart større samfunn", "Fordi jordbruk gjorde livet betre for alle menneske"], "correct": 2, "ok": "Ja. Poenget er samanhengen mellom matproduksjon og store endringar i korleis menneske budde, arbeidde og organiserte samfunnet.", "no": "Prøv å finne svaret som bind saman fleire konsekvensar i ei historisk årsakskjede."}]; let i=0, chosen=Array(qs.length).fill(null);
const Q=document.getElementById('question'),A=document.getElementById('answers'),F=document.getElementById('feedback'),N=document.getElementById('next'),P=document.getElementById('prev'),L=document.getElementById('label'),B=document.getElementById('fill');
function render(){
 let x=qs[i]; Q.textContent=x.q; L.textContent=`Spørsmål ${i+1} av ${qs.length}`; B.style.width=`${(i+1)/qs.length*100}%`; A.innerHTML=''; F.className='feedback'; F.textContent='';
 x.options.forEach((o,j)=>{let b=document.createElement('button');b.className='answer'+(chosen[i]===j?' selected':'');b.textContent=o;b.onclick=()=>{chosen[i]=j;render()};A.appendChild(b)});
 if(chosen[i]!==null){let good=chosen[i]===x.correct;F.textContent=good?x.ok:x.no;F.className='feedback '+(good?'good':'bad')}
 P.style.visibility=i===0?'hidden':'visible';N.disabled=chosen[i]===null;N.textContent=i===qs.length-1?'Sjå resultat':'Neste';
}
N.onclick=()=>{if(chosen[i]===null)return;if(i<qs.length-1){i++;render()}else show()};
P.onclick=()=>{if(i>0){i--;render()}};
function show(){let s=chosen.reduce((n,a,k)=>n+(a===qs[k].correct),0);document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=`${s} av ${qs.length}`;document.getElementById('message').textContent=s>=10?'Veldig bra! Du viser god forståing av samanhengane.':s>=7?'Bra jobba! Du har mykje på plass. Sjå særleg på forklaringane til spørsmåla du bomma på.':'Godt forsøk! Repeter hovudsamanhengane og prøv ein gong til.';L.textContent='Ferdig';B.style.width='100%'}
document.getElementById('restart').onclick=()=>{i=0;chosen=Array(qs.length).fill(null);document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render()};render();
</script></body></html>
